<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Belum Dibuka</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .alert-card {
    background-color: #ffffff;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    text-align: center;
    max-width: 400px;
    width: 90%;
  }
  .icon {
    font-size: 50px;
    margin-bottom: 15px;
  }
  .title {
    color: #1f2937;
    margin: 0 0 10px;
    font-size: 22px;
  }
  .message {
    color: #6b7280;
    margin: 0 0 25px;
    font-size: 15px;
    line-height: 1.6;
  }
  .btn-back {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background-color 0.2s;
  }
  .btn-back:hover {
    background-color: #1d4ed8;
  }
</style>
</head>
<body>

<div class="alert-card">
  <div class="icon">⏱️</div>
  <h2 class="title">Sistem Belum Dibuka</h2>
  <p class="message">
    Mohon maaf, akses ujian CAT online belum dimulai. Silakan muat ulang halaman ini saat jadwal ujian Anda tiba.
  </p>
  <a href="#" class="btn-back">Kembali ke Beranda</a>
</div>

</body>
</html>
